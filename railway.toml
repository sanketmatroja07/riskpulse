# Railway: build from repo root so Dockerfile COPY paths match.
# In the Railway service UI, leave "Root Directory" **empty** (or "/").
# See DEPLOY.md
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
startCommand = "sh start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[service]
internalPort = 8000
